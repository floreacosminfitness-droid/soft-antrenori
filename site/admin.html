<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Statistici · CoachMeal</title>
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/fonts/geist.css">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<style>
  body { background: #F6F5F2; }
  .adm { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .adm-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .adm-top h1 { font-size: 1.6rem; letter-spacing: -.02em; margin: 0; flex: 1; }
  .adm .tabs { margin: 0; } .adm .tabs button { white-space: nowrap; }
  .adm .card { margin: 0 0 16px; } .grid2 > .card { margin: 0; } .grid2 { margin-bottom: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: #fff; border: 1px solid #E4E1DA; border-radius: 16px; padding: 16px 18px; }
  .kpi b { display: block; font-size: 2rem; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi span { display: block; margin-top: 8px; font-size: .86rem; color: #5E5B55; }
  .kpi.main { background: #2448FF; border-color: #2448FF; color: #fff; }
  .kpi.main span { color: #D4DBFF; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  .adm .card h2 { font-size: 1.05rem; margin: 0 0 4px; }
  .adm .card .sub { font-size: .84rem; color: #8A867F; margin: 0 0 12px; }
  .bars { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 160px; border-bottom: 1px solid #D6D2CA; }
  .bars .b { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; position: relative; cursor: default; }
  .bars .b i { display: block; width: 100%; background: #2448FF; border-radius: 4px 4px 0 0; min-height: 0; }
  .bars.tr .b i { background: #141414; }
  .bars .b:hover i, .bars .b:focus i { background: #0f2fd6; }
  .bars.tr .b:hover i { background: #3b3a36; }
  .bars .b:hover .tip, .bars .b:focus .tip { display: block; }
  .tip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: #141414; color: #fff; font-size: .78rem; padding: 6px 9px; border-radius: 8px; white-space: nowrap; z-index: 2; pointer-events: none; }
  .axis { display: flex; justify-content: space-between; font-size: .74rem; color: #8A867F; margin-top: 6px; }
  .rows { margin: 0; padding: 0; list-style: none; }
  .rows li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid #ECE9E3; font-size: .92rem; }
  .rows li:first-child { border-top: 0; }
  .rows li span:last-child { font-variant-numeric: tabular-nums; color: #5E5B55; }
  .tbl-wrap { overflow-x: auto; }
  table.adm-t { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 760px; }
  .adm-t th { text-align: left; font-size: .78rem; color: #8A867F; font-weight: 600; padding: 0 8px 8px; }
  .adm-t td { padding: 10px 8px; border-top: 1px solid #ECE9E3; vertical-align: top; }
  .adm-t td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .adm-t .muted { color: #8A867F; font-size: .82rem; }
  .pill-full { display: inline-block; font-size: .74rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #fff0f0; color: #a3261c; }
  .pill-near { display: inline-block; font-size: .74rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #fff6e0; color: #7a4d00; }
  .use { display: inline-block; width: 70px; height: 6px; border-radius: 99px; background: #ECE9E3; vertical-align: middle; margin-left: 8px; overflow: hidden; }
  .use i { display: block; height: 100%; background: #2448FF; }
  .use.full i { background: #a3261c; }
  details.tv summary { cursor: pointer; font-size: .86rem; color: #5E5B55; margin-top: 10px; }
  details.tv table { width: 100%; border-collapse: collapse; font-size: .84rem; margin-top: 8px; }
  details.tv td, details.tv th { padding: 4px 6px; border-top: 1px solid #ECE9E3; text-align: right; }
  details.tv td:first-child, details.tv th:first-child { text-align: left; }
</style>
</head>
<body>
<main class="adm">
  <div class="adm-top">
    <a class="pt-brand" href="./" aria-label="CoachMeal"><b>c<svg class="pt-o" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="currentColor"/><circle cx="32" cy="32" r="17" fill="none" stroke="#F6F5F2" stroke-width="5"/></svg>ach</b><span>meal</span></a>
    <h1>Statistici</h1>
    <div class="tabs" id="per" role="tablist" aria-label="Perioada">
      <button type="button" data-d="7">7 zile</button><button type="button" data-d="30" class="on">30 de zile</button><button type="button" data-d="90">90 de zile</button>
    </div>
    <a class="btn btn-ghost btn-sm" href="antrenor.html">Panoul meu</a>
  </div>
  <p id="msg" class="msg" hidden></p>
  <div id="out"><p class="muted">Se încarcă…</p></div>
</main>
<script>
(function () {
  var App = window.App, sb = App.sb, esc = App.esc, days = 30;
  var $ = function (id) { return document.getElementById(id); };
  var NAMES = { trial: 'Probă', gratuit: 'Gratuit', start: 'Start', pro: 'Pro', studio: 'Studio', none: 'Fără abonament' };
  function n(x) { return (+x || 0).toLocaleString('ro-RO'); }
  function pct(a, b) { return b ? (Math.round(a / b * 1000) / 10).toLocaleString('ro-RO') + '%' : '—'; }
  function dd(s) { return new Date(s + 'T12:00:00Z').toLocaleDateString('ro-RO', { day: 'numeric', month: 'short' }); }
  function sum(arr, k) { return arr.reduce(function (a, x) { return a + (+x[k] || 0); }, 0); }

  function bars(daily, key, label, cls) {
    var max = Math.max(1, Math.max.apply(null, daily.map(function (x) { return +x[key] || 0; })));
    return '<div class="bars ' + (cls || '') + '" role="img" aria-label="' + esc(label) + ' pe zile">' + daily.map(function (x) {
      var v = +x[key] || 0, h = v ? Math.max(3, Math.round(v / max * 100)) : 0;
      return '<div class="b" tabindex="0"><i style="height:' + h + '%"></i><span class="tip">' + dd(x.day) + ': ' + n(v) + ' ' + esc(label.toLowerCase()) + '</span></div>';
    }).join('') + '</div><div class="axis"><span>' + dd(daily[0].day) + '</span><span>' + dd(daily[daily.length - 1].day) + '</span></div>';
  }
  function table(daily) {
    return '<details class="tv"><summary>Vezi cifrele pe zile</summary><table><thead><tr><th>Ziua</th><th>Vizite</th><th>Înscriere deschisă</th><th>Antrenori noi</th><th>Clienți noi</th></tr></thead><tbody>' +
      daily.slice().reverse().map(function (x) { return '<tr><td>' + dd(x.day) + '</td><td>' + n(x.views) + '</td><td>' + n(x.signup_views) + '</td><td>' + n(x.trainers) + '</td><td>' + n(x.clients) + '</td></tr>'; }).join('') +
      '</tbody></table></details>';
  }
  function list(rows, k) {
    if (!rows.length) return '<p class="muted small" style="margin:0">Nimic încă.</p>';
    return '<ul class="rows">' + rows.map(function (r) { return '<li><span>' + esc(r[k]) + '</span><span>' + n(r.n) + '</span></li>'; }).join('') + '</ul>';
  }
  function trainersTable(ts) {
    return '<div class="tbl-wrap"><table class="adm-t"><thead><tr><th>Antrenor</th><th>Înscris</th><th>Abonament</th><th>Clienți activi</th><th>Refuzați (7 zile)</th><th>Ultima intrare</th></tr></thead><tbody>' +
      ts.map(function (t) {
        var b = t.billing || {}, used = +b.used || 0, lim = +b.limit || 0, full = b.active && lim && used >= lim, near = b.active && !full && lim >= 5 && lim - used <= 2;
        return '<tr><td><b>' + esc(t.display_name) + '</b><div class="muted">' + esc(t.email || '') + '</div></td>' +
          '<td class="num">' + App.fmtDate(t.created_at) + '</td>' +
          '<td>' + esc(NAMES[b.plan] || b.plan || '') + (b.plan === 'trial' && t.trial_ends_at ? '<div class="muted">până pe ' + App.fmtDate(t.trial_ends_at) + '</div>' : '') + (b.cancel_at_end ? '<div class="muted">anulat la final</div>' : '') + '</td>' +
          '<td class="num">' + used + ' / ' + lim + '<span class="use' + (full ? ' full' : '') + '"><i style="width:' + (lim ? Math.min(100, used / lim * 100) : 0) + '%"></i></span> ' + (full ? '<span class="pill-full">plin</span>' : near ? '<span class="pill-near">aproape plin</span>' : '') + (+t.archived ? '<div class="muted">+ ' + t.archived + ' arhivați</div>' : '') + '</td>' +
          '<td class="num">' + (+b.blocked_7d ? '<b>' + b.blocked_7d + '</b>' : '0') + '</td>' +
          '<td class="num">' + (t.last_sign_in_at ? App.ago(t.last_sign_in_at) : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  async function load() {
    $('out').style.opacity = .5;
    var r = await sb.rpc('admin_stats', { days: days });
    $('out').style.opacity = 1;
    if (r.error) { $('out').innerHTML = ''; return App.msg($('msg'), /DOAR_ADMIN/.test(r.error.message) ? 'Pagina asta e doar pentru proprietarul CoachMeal.' : App.ro(r.error)); }
    var s = r.data, d = s.daily, views = sum(d, 'views'), sv = sum(d, 'signup_views'), tr = sum(d, 'trainers'), cl = sum(d, 'clients');
    var full = s.trainers.filter(function (t) { var b = t.billing || {}; return b.active && +b.limit && +b.used >= +b.limit; }).length;
    $('out').innerHTML =
      '<div class="kpis">' +
        '<div class="kpi main"><b>' + n(views) + '</b><span>vizite pe site</span></div>' +
        '<div class="kpi"><b>' + n(sv) + '</b><span>au deschis înscrierea de antrenor · ' + pct(sv, views) + ' din vizite</span></div>' +
        '<div class="kpi"><b>' + n(tr) + '</b><span>conturi noi de antrenor · ' + pct(tr, views) + ' din vizite</span></div>' +
        '<div class="kpi"><b>' + n(cl) + '</b><span>clienți noi înscriși</span></div>' +
        '<div class="kpi"><b>' + n(s.totals.paying) + ' / ' + n(s.totals.trainers) + '</b><span>antrenori care plătesc, din total</span></div>' +
        '<div class="kpi"><b>' + n(full) + '</b><span>antrenori la limita de clienți</span></div>' +
      '</div>' +
      '<section class="card"><h2>Vizite pe site</h2><p class="sub">Câte vizite a avut prima pagină în fiecare zi. Treci cu mouse-ul peste o bară pentru cifră.</p>' + bars(d, 'views', 'Vizite') + table(d) + '</section>' +
      '<div class="grid2">' +
        '<section class="card"><h2>Conturi noi de antrenor</h2><p class="sub">Pe zile, în aceeași perioadă.</p>' + bars(d, 'trainers', 'Antrenori noi', 'tr') + '</section>' +
        '<section class="card"><h2>De unde vin vizitele</h2><p class="sub">Site-ul de pe care au venit. „(direct)” = au scris adresa sau link fără sursă.</p>' + list(s.refs, 'ref') +
          (s.utms.length ? '<h2 style="margin-top:16px">Campanii (utm)</h2>' + list(s.utms, 'utm') : '') +
          '<p class="sub" style="margin:14px 0 0">Telefon: <b>' + n(s.devices.mobile) + '</b> · Calculator: <b>' + n(s.devices.desktop) + '</b></p></section>' +
      '</div>' +
      '<section class="card"><h2>Antrenori</h2><p class="sub">Toți antrenorii, cu câți clienți activi au din limita abonamentului. Cei care ajung la limită văd automat în panoul lor cererea de a trece la planul următor.</p>' + trainersTable(s.trainers) + '</section>';
  }

  document.getElementById('per').addEventListener('click', function (e) {
    var b = e.target.closest('[data-d]'); if (!b) return;
    days = +b.getAttribute('data-d');
    document.querySelectorAll('#per button').forEach(function (x) { x.classList.toggle('on', x === b); });
    load();
  });

  (async function () {
    var s = await sb.auth.getSession();
    if (!s.data.session) return location.replace('cont.html');
    load().catch(function (e) { App.msg($('msg'), App.ro(e)); });
  })();
})();
</script>
</body>
</html>
